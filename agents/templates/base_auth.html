<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MyGPGD J360{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --gradient-brand: linear-gradient(135deg, #4f46e5 0%, #7c3aed 50%, #06b6d4 100%);
            --shadow-lift: 0 20px 50px rgba(30,27,75,0.18);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f7f7fb;
        }
        h1, h2, h3, .brand-font { font-family: 'Lexend', 'Inter', sans-serif; letter-spacing: -0.01em; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatSlow {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(10px, -14px) rotate(6deg); }
        }

        .auth-shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 1.05fr 1fr;
        }

        .auth-visual {
            background: var(--gradient-brand);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem;
            color: white;
        }

        .auth-visual .blob {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.09);
        }
        .auth-visual .blob.b1 { width: 320px; height: 320px; top: -100px; left: -80px; animation: floatSlow 9s ease-in-out infinite; }
        .auth-visual .blob.b2 { width: 220px; height: 220px; bottom: -70px; right: -40px; animation: floatSlow 11s ease-in-out infinite reverse; }
        .auth-visual .blob.b3 { width: 140px; height: 140px; bottom: 30%; left: 8%; background: rgba(255,255,255,0.06); animation: floatSlow 7s ease-in-out infinite; }

        .auth-visual .brand-mark {
            width: 52px; height: 52px; border-radius: 15px;
            background: rgba(255,255,255,0.18);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; margin-bottom: 1.75rem; position: relative;
            backdrop-filter: blur(4px);
        }

        .auth-visual h1 { font-size: 2rem; font-weight: 700; position: relative; max-width: 420px; }
        .auth-visual p { color: rgba(255,255,255,0.85); font-size: 1.02rem; position: relative; max-width: 420px; }

        .auth-visual .feature-list { list-style: none; padding: 0; margin-top: 2rem; position: relative; }
        .auth-visual .feature-list li { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.9rem; color: rgba(255,255,255,0.92); font-size: 0.95rem; }
        .auth-visual .feature-list i { font-size: 1.1rem; opacity: 0.9; }

        .auth-form-side {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            animation: fadeInUp 0.5s ease both;
        }

        .auth-card .form-control {
            border-radius: 9px;
            padding: 0.65rem 0.85rem;
            border: 1.5px solid #e4e4f0;
        }
        .auth-card .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.12);
        }
        .auth-card .btn-primary {
            background: var(--gradient-brand);
            border: none;
            border-radius: 9px;
            padding: 0.7rem 1rem;
            font-weight: 600;
            box-shadow: 0 6px 18px rgba(79,70,229,0.3);
        }
        .auth-card .btn-primary:hover { filter: brightness(1.07); }

        @media (max-width: 860px) {
            .auth-shell { grid-template-columns: 1fr; }
            .auth-visual { padding: 2.5rem; min-height: 220px; }
            .auth-visual h1 { font-size: 1.4rem; }
            .auth-visual .feature-list { display: none; }
        }
    </style>
</head>
<body>
{% include 'partials/demo_banner.html' %}
    {% if messages %}
        <div style="position:fixed; top:1rem; right:1rem; z-index:2000; max-width:360px;">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
