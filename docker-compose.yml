services:
  web:
    build: .
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - sqlite-data:/app/data
      - media-data:/app/media
      - temp-uploads:/app/temp_uploads
    environment:
      # SQLite path points into the mounted volume dir above so the db file
      # survives `docker compose down`/rebuilds.
      - DJANGO_DB_PATH=/app/data/db.sqlite3

  # Sends the monthly reminder (3rd week) and monthly statistics (end of 1st week) when due.
  # Checks every hour; sending is idempotent, so nothing goes out twice.
  scheduler:
    build: .
    env_file:
      - .env
    volumes:
      - sqlite-data:/app/data
      - media-data:/app/media
      - temp-uploads:/app/temp_uploads
    environment:
      - DJANGO_DB_PATH=/app/data/db.sqlite3
    # Waits for the web service to apply database migrations before the first check.
    entrypoint: ["sh", "-c", "sleep 120; while true; do python manage.py run_scheduled_jobs; sleep 3600; done"]
    depends_on:
      - web
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  sqlite-data:
  media-data:
  temp-uploads:
  caddy-data:
  caddy-config:
